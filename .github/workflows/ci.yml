name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test
      - run: cargo build --target wasm32-unknown-unknown --release
      # The built module, run by the editor: it renders, sits beside the editor, opens links,
      # and its fuel per document is measured against the budget the editor gives it.
      - name: The module in the editor
        run: |
          git clone --depth 1 https://github.com/Tim-kieboom/TerminalCode ../TerminalCode
          TRCODE_PLUGIN_MARKDOWN_DIR="$PWD" cargo test --manifest-path ../TerminalCode/Cargo.toml -p terminal_code real_markdown -- --ignored
