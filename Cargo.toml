[package]
name = "trcode-plugin-markdown"
description = "A markdown preview for TerminalCode, in a pane beside the editor"
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Tim Kieboom"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The plugin API of the editor, by tag of its repository; bump the tag by hand when
# the API changes (and `abi` in manifest.toml with it).
trcode-plugin-api = { git = "https://github.com/Tim-kieboom/TerminalCode", tag = "plugin-api-1.5.1" }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
